[project]
name = "golden-touch-backend"
version = "0.1.0"
description = "Backend for Golden Touch Quant OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.14",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "celery[redis]>=5.3.6",
    "ccxt>=4.2.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "backtrader>=1.9.78.123",
    "ray>=2.9.0",
    "akshare>=1.12.80",
    "pgvector>=0.2.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "networkx>=3.2.1",
    # LLM/Agent (Mixed Approach)
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "faiss-cpu>=1.8.0",
    "tiktoken>=0.5.2",
    # Sandbox
    "restrictedpython>=7.0",
    # LLM SDKs
    "zhipuai>=2.1.0",
    "openai>=1.0.0",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-env>=1.1.3",
    "httpx>=0.26.0",  # For testing FastAPI
    "ruff>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
