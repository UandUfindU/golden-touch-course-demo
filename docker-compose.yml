version: '3.8'

services:
  # PostgreSQL with TimescaleDB + pgvector
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: golden_pg
    environment:
      POSTGRES_USER: golden_user
      POSTGRES_PASSWORD: golden_password
      POSTGRES_DB: golden_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/home/postgres/pgdata/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden_user -d golden_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker & State Store (Celery + LangGraph)
  redis:
    image: redis:7-alpine
    container_name: golden_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  pg_data:
  redis_data:
